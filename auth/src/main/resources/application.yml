spring:
  application:
    name: auth-service

  datasource:
    url: ${env.DB_URL:jdbc:postgresql://localhost:5432/llm}
    username: ${env.DB_USERNAME:postgres}
    password: ${env.DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    baseline-on-migrate: true
    check-location: true

  data:
    redis:
      host: ${env.REDIS_HOST:localhost}
      port: ${env.REDIS_PORT:6379}
      password: ${env.REDIS_PASSWORD:}
      timeout: ${env.REDIS_TIMEOUT:2000}

  cloud:
    nacos:
      discovery:
        server-addr: ${env.NACOS_ADDR:localhost:8848}

jwt:
  secret: ${env.JWT_SECRET:default_jwt_secret}
  expiration: ${env.JWT_EXPIRATION:86400000}
  refresh-token:
    expiration: ${env.JWT_REFRESH_EXPIRATION:604800000}

server:
  port: ${env.SERVER_PORT:10024}

logging:
  level:
    com.wendy.auth.utils.JwtUtil: debug